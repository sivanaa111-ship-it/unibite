<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="/img/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800\&display=swap"><link rel="stylesheet" href="/css/styles.css">
<title>Forgot password · UniBite</title>
<meta name="description" content="UniBite — Your Campus. Your Cravings. One Click.">
</head>
<body>
<main id="main" class="auth-main" style="min-height:70vh"><div class="auth-card card card-pad" id="view">
  <h1 style="font-size:1.75rem">Forgot your password?</h1>
  <p class="muted">Enter your account email and we will send you a secure link to choose a new password.</p>
  <form id="forgot-form" class="stack" novalidate>
    <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="email" required></div>
    <button class="btn btn-primary btn-block" type="submit" data-busy="Sending…">Send reset link</button>
  </form>
  <p class="small" style="margin-top:16px"><a href="/login.html">Back to login</a></p>
</div></main>
<script type="module" src="/js/pages/forgot.js"></script>
</body>
</html>
