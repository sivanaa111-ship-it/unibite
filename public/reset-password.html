<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="/img/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800\&display=swap"><link rel="stylesheet" href="/css/styles.css">
<title>Set password · UniBite</title>
<meta name="description" content="UniBite — Your Campus. Your Cravings. One Click.">
</head>
<body>
<main id="main" class="auth-main" style="min-height:70vh"><div class="auth-card card card-pad" id="reset-view">
  <h1 style="font-size:1.75rem">Choose a new password</h1><p class="muted" id="reset-intro">Checking your link…</p>
  <form id="reset-form" class="stack hidden" novalidate>
    <div class="field"><label for="password">New password</label><input class="input" id="password" name="password" type="password" autocomplete="new-password" required><span class="hint">At least 8 characters with a letter and a number.</span></div>
    <div class="field"><label for="confirm_password">Confirm password</label><input class="input" id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required></div>
    <button class="btn btn-primary btn-block" type="submit" data-busy="Saving…">Save password</button>
  </form>
</div></main>
<script type="module" src="/js/pages/reset.js"></script>
</body>
</html>
