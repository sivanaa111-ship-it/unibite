<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="/img/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800\&display=swap"><link rel="stylesheet" href="/css/styles.css">
<title>Admin sign in · UniBite</title>
<meta name="description" content="UniBite — Your Campus. Your Cravings. One Click.">
</head>
<body>
<main id="main" class="auth-main" style="min-height:100vh;background:#1E293B">
  <div class="auth-card card card-pad" style="max-width:420px">
    <div class="row" style="margin-bottom:16px"><span class="brand-mark" data-icon-big="shield"></span><div><strong style="font-size:1.1rem;color:var(--color-heading)">UniBite Admin</strong><div class="small muted">Super Admin access only</div></div></div>
    <form id="admin-login" class="stack" novalidate>
      <div class="field"><label for="email">Administrator email</label><input class="input" id="email" name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label><input class="input" id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary btn-block btn-lg" type="submit" data-busy="Signing in…">Sign in</button>
    </form>
    <form id="admin-mfa" class="stack hidden" novalidate>
      <p class="muted small" style="margin:0">Enter the 6-digit code from your authenticator app.</p>
      <div class="field"><label for="code">Verification code</label><input class="input" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" style="font-size:1.4rem;letter-spacing:.3em;text-align:center"></div>
      <button class="btn btn-primary btn-block btn-lg" type="submit" data-busy="Verifying…">Verify</button>
    </form>
    <p class="small muted" style="margin-top:16px">Not an administrator? <a href="/login.html">Go to the main login</a></p>
  </div>
</main>
<script type="module" src="/js/admin/login.js"></script>
</body>
</html>
