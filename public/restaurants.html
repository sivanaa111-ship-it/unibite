<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="/img/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800\&display=swap"><link rel="stylesheet" href="/css/styles.css">
<title>Restaurants · UniBite</title>
<meta name="description" content="UniBite — order from campus restaurants, cafés and food trucks.">
</head>
<body>
<main id="main" class="container">
  <div class="page-head">
    <h1 style="font-size:2.25rem">Campus restaurants</h1>
    <p class="muted">Every restaurant, café and food truck currently serving on campus.</p>
    <div class="segmented" role="group" aria-label="Search mode" style="margin-top:8px">
      <button type="button" data-mode="restaurants" aria-pressed="true">Restaurants</button>
      <button type="button" data-mode="dishes" aria-pressed="false">Dishes &amp; drinks</button>
    </div>
  </div>
  <div class="chip-row" id="cat-chips" role="group" aria-label="Filter by category"></div>
  <form class="filters" id="filters" role="search">
    <div class="input-icon"><span data-icon="search"></span><label for="q" class="sr-only">Search</label><input id="q" name="q" class="input" placeholder="Search by name or location"></div>
    <label class="sr-only" for="section">Menu category</label>
    <select id="section" name="section" class="select hidden" style="width:auto"><option value="">All menu categories</option></select>
    <label class="sr-only" for="availability">Availability</label>
    <select id="availability" name="availability" class="select" style="width:auto"><option value="">Any availability</option><option value="open">Open</option><option value="busy">Busy</option><option value="closed">Closed</option></select>
    <label class="sr-only" for="sort">Sort</label>
    <select id="sort" name="sort" class="select" style="width:auto"><option value="name_asc">Name A–Z</option><option value="name_desc">Name Z–A</option><option value="rating">Top rated</option><option value="newest">Newest</option></select>
  </form>
  <p class="muted small" id="result-count" aria-live="polite"></p>
  <div class="r-grid" id="grid"></div>
  <nav class="pager" id="pager" aria-label="Pagination"></nav>
</main>
<script type="module" src="/js/pages/restaurants.js"></script>
</body>
</html>
